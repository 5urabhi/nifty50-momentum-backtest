name: Verify React quant research workstation

on:
  push:
    branches:
      - main
      - workstation/quant-research-development-20261112
      - feature/quantlab-model-laboratory-and-guide-20261113
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR commits should not install Python/Chromium repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build React/Vite workstation
        run: npm run build

      - name: Install Python research engine
        run: python -m pip install -r requirements.txt

      - name: Test bulk Dhan catalog, cache, resume and risk scope
        run: python -m unittest discover -s tests -p 'test_dhan_bulk_workspace.py' -v

      - name: Test local FastAPI and React workstation model endpoints
        run: python -m unittest discover -s tests -p 'test_react_workstation_api.py' -v

      - name: Run existing research regression suite
        run: python -m unittest discover -s tests -v

      - name: Measure synthetic 50 / 100 / 300-security research performance
        run: |
          mkdir -p artifacts
          python scripts/benchmark_research.py --assets 50,100,300 --periods 120 --output artifacts/scalability.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantlab-synthetic-software-scalability
          path: artifacts/scalability.json
          retention-days: 14

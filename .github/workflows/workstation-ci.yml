name: Verify React quant research workstation

on:
  push:
    branches:
      - workstation/quant-research-development-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build React/Vite workstation
        run: npm run build

      - name: Install Python research engine
        run: python -m pip install -r requirements.txt

      - name: Test bulk Dhan catalog, cache, resume and risk scope
        run: python -m unittest discover -s tests -p 'test_dhan_bulk_workspace.py' -v

      - name: Test local FastAPI and React workstation model endpoints
        run: python -m unittest discover -s tests -p 'test_react_workstation_api.py' -v

      - name: Run existing research regression suite
        run: python -m unittest discover -s tests -v

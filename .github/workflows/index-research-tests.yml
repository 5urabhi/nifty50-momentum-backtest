name: Index research core tests
on:
  push:
    branches:
      - research/multi-factor-equity-index
  pull_request:
    paths:
      - "index_research/**"
      - "tests/**"
      - ".github/workflows/index-research-tests.yml"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - run: python -m unittest discover -s tests -v
